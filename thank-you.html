<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, noai, noimageai">
  <!-- Google tag (gtag.js) -->

  <title>Thank You — Ric Berryman</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@300;400;500&family=Oswald:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --black: #0a0a0a;
      --ink: #111111;
      --bone: #e8e4dd;
      --grey: #8a8a8a;
      --accent: #d9013c;
      --bebas: 'Bebas Neue', sans-serif;
      --oswald: 'Oswald', sans-serif;
      --mont: 'Montserrat', sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { background: var(--black); }
    body {
      background: var(--black);
      color: var(--bone);
      font-family: var(--mont);
      overflow-x: hidden;
      min-height: 100vh;
    }
    ::selection { background: var(--accent); color: var(--bone); }
    a { color: inherit; text-decoration: none; }

    /* ============ NAV ============ */
    .nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.5rem 2.5rem;
      mix-blend-mode: difference;
    }
    .nav-mark { font-family: var(--bebas); font-size: 1.4rem; letter-spacing: 0.12em; color: #fff; }
    .nav-links { display: flex; gap: 2.25rem; list-style: none; }
    .nav-links a {
      font-family: var(--oswald); font-weight: 400; font-size: 0.72rem;
      letter-spacing: 0.3em; text-transform: uppercase; color: #fff;
      position: relative; padding-bottom: 4px;
    }
    .nav-links a::after {
      content: ''; position: absolute; left: 0; bottom: 0;
      width: 100%; height: 1px; background: #fff;
      transform: scaleX(0); transform-origin: right;
      transition: transform 0.4s cubic-bezier(0.76, 0, 0.24, 1);
    }
    .nav-links a:hover::after { transform: scaleX(1); transform-origin: left; }
    .nav-burger { display: none; background: none; border: 0; cursor: pointer; width: 30px; height: 16px; position: relative; z-index: 110; padding: 0; }
    .nav-burger span { position: absolute; left: 0; width: 100%; height: 2px; background: #fff; transition: transform 0.45s cubic-bezier(0.76,0,0.24,1), opacity 0.3s ease; }
    .nav-burger span:nth-child(1) { top: 2px; }
    .nav-burger span:nth-child(2) { bottom: 2px; }
    .nav.open .nav-burger span:nth-child(1) { top: 7px; transform: rotate(45deg); }
    .nav.open .nav-burger span:nth-child(2) { bottom: 7px; transform: rotate(-45deg); }
    @media (max-width: 760px) {
      .nav { padding: 1.1rem 1.25rem; }
      .nav-mark { font-size: 1.05rem; white-space: nowrap; position: relative; z-index: 110; }
      .nav-burger { display: block; }
      .nav.open { mix-blend-mode: normal; transform: none !important; }
      .nav-links {
        position: fixed; inset: 0; z-index: 105;
        flex-direction: column; align-items: flex-start; justify-content: center;
        gap: 0.15rem; padding: 2rem 1.5rem; margin: 0;
        background: var(--black);
        transform: translateY(-100%); opacity: 0; pointer-events: none;
        transition: transform 0.6s cubic-bezier(0.76,0,0.24,1), opacity 0.4s ease;
      }
      .nav.open .nav-links { transform: translateY(0); opacity: 1; pointer-events: auto; }
      .nav-links a {
        font-family: var(--bebas); font-size: clamp(2.2rem, 11vw, 3rem); letter-spacing: 0.03em;
        color: var(--bone); padding-bottom: 0; white-space: nowrap;
      }
      .nav-links a::after { display: none; }
    }

    /* ============ CONFIRMATION ============ */
    .ty {
      position: relative; min-height: 100vh; min-height: 100svh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 8rem 1.5rem 4rem;
    }
    .ty::before {
      content: ''; position: absolute; left: 50%; top: 38%;
      width: min(70vw, 620px); height: min(70vw, 620px); transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(217,1,60,0.16) 0%, rgba(217,1,60,0) 68%);
      pointer-events: none; z-index: 0;
    }
    .ty-inner { position: relative; z-index: 1; }
    .ty-kicker {
      font-family: var(--oswald); font-weight: 300; font-size: 0.72rem;
      letter-spacing: 0.5em; text-indent: 0.5em; text-transform: uppercase;
      color: var(--accent); margin-bottom: 1.6rem;
      opacity: 0; transform: translateY(14px); animation: rise 0.9s 0.1s forwards cubic-bezier(0.22,1,0.36,1);
    }
    .ty-title {
      font-family: var(--bebas); text-transform: uppercase;
      font-size: clamp(4.5rem, 16vw, 13rem); line-height: 0.82; color: var(--bone);
    }
    .ty-title .line { display: block; overflow: hidden; }
    .ty-title .line span {
      display: inline-block;
      opacity: 0; transform: translateY(100%);
      animation: rise 1s forwards cubic-bezier(0.22,1,0.36,1);
    }
    .ty-title .line:nth-child(1) span { animation-delay: 0.2s; }
    .ty-title .line:nth-child(2) span { animation-delay: 0.32s; }
    .ty-title .outline { color: transparent; -webkit-text-stroke: 1.5px rgba(232,228,221,0.7); }
    .ty-copy {
      max-width: 46ch; margin: 2.2rem auto 0;
      font-family: var(--mont); font-weight: 300; font-size: 1rem; line-height: 1.85;
      color: rgba(232,228,221,0.78);
      opacity: 0; transform: translateY(14px); animation: rise 0.9s 0.5s forwards cubic-bezier(0.22,1,0.36,1);
    }
    .ty-actions {
      margin-top: 3rem; display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;
      opacity: 0; transform: translateY(14px); animation: rise 0.9s 0.66s forwards cubic-bezier(0.22,1,0.36,1);
    }
    .ty-btn {
      font-family: var(--oswald); font-weight: 500; font-size: 0.72rem;
      letter-spacing: 0.3em; text-indent: 0.3em; text-transform: uppercase;
      padding: 1rem 2.4rem; border-radius: 999px;
      border: 1px solid rgba(232,228,221,0.28);
      transition: background 0.35s ease, color 0.35s ease, border-color 0.35s ease;
    }
    .ty-btn.primary { background: var(--bone); color: var(--black); border-color: var(--bone); }
    .ty-btn.primary:hover { background: var(--accent); border-color: var(--accent); color: var(--bone); }
    .ty-btn.ghost:hover { border-color: var(--bone); color: var(--bone); }

    @keyframes rise { to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) {
      .ty-kicker, .ty-title .line span, .ty-copy, .ty-actions { animation: none; opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <nav class="nav">
    <a class="nav-mark" href="/index.html">RIC BERRYMAN</a>
    <ul class="nav-links">
      <li><a href="/portfolio.html">Editorials</a></li>
      <li><a href="/portraits.html">Portraits</a></li>
      <li><a href="/dance.html">Dance</a></li>
      <li><a href="/abandoned.html">Abandoned</a></li>
      <li><a href="/field-notes.html">Field Notes</a></li>
      <li><a href="/index.html#contact-v3">Contact</a></li>
    </ul>
    <button class="nav-burger" id="navBurger" type="button" aria-label="Menu"><span></span><span></span></button>
  </nav>

  <main class="ty">
    <div class="ty-inner">
      <div class="ty-kicker">Message received</div>
      <h1 class="ty-title">
        <span class="line"><span>Thank</span></span>
        <span class="line"><span class="outline">You</span></span>
      </h1>
      <p class="ty-copy">
        Your message is in. I read every one personally and I'll get back to you
        directly — usually within a day or two. In the meantime, keep looking around.
      </p>
      <div class="ty-actions">
        <a class="ty-btn primary" href="/index.html">Back home</a>
        <a class="ty-btn ghost" href="/portfolio.html">See the work</a>
      </div>
    </div>
  </main>

  <script>(function(){var n=document.querySelector('.nav'),b=document.getElementById('navBurger');if(!n||!b)return;b.addEventListener('click',function(){n.classList.toggle('open');});n.querySelectorAll('.nav-links a').forEach(function(a){a.addEventListener('click',function(){n.classList.remove('open');});});})();</script>
</body>
</html>
